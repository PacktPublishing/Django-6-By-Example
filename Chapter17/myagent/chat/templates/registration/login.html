{% extends "base.html" %}

{% block title %}Log in · Tea Shop Assistant{% endblock %}

{% block content %}
  <section class="card auth">
    <h1>Log in</h1>
    <form method="post" class="stack">
      {% csrf_token %}
      {{ form.as_div }}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="button" type="submit">Log in</button>
    </form>
  </section>
{% endblock %}
